# solar-kiosk logins. Copy to ~/.config/solar-kiosk/secrets.toml, then: chmod 600 secrets.toml
# The program refuses to start if other users can read this file.

[enphase]
# Your Enlighten login, used to fetch the gateway token (firmware 7+). Not supported for accounts with MFA:
# instead get a token from Enphase's website and put it in `token`.
username = "you@example.com"
password = "change-me"
# token = ""

[franklin]
# Your FranklinWH app login.
email = "you@example.com"
password = "change-me"
