# solar-kiosk logins. Copy to ~/.config/solar-kiosk/secrets.toml, then: chmod 600 secrets.toml
# The program refuses to start if other users can read this file.

[enphase]
# Recommended: a token you make on Enphase's website (entrez.enphaseenergy.com), so this file holds no Enphase
# password. It lasts a year. Steps: docs/setup.md. The settings page does all of this for you.
token = "paste-the-token-here"
# Or instead, your Enphase app login: the app then fetches and renews the token itself. Not for accounts that
# ask for a code from a phone when signing in.
# username = "you@example.com"
# password = "change-me"

[franklin]
# Your FranklinWH app login.
email = "you@example.com"
password = "change-me"
