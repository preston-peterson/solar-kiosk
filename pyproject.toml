[project]
name = "solar-kiosk"
version = "0.1.0"
description = "Solar and battery kiosk for a Raspberry Pi: Enphase IQ Gateway, FranklinWH aGate and WeatherFlow Tempest"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyenphase>=6.1,<7",
    "franklinwh>=2026.3",
    "zeroconf>=0.136",
    "aiohttp>=3.9",
    "segno>=1.6",
]

[project.scripts]
solar-kiosk = "solar_kiosk.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_kiosk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
