# Controls the issue template chooser.
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# Pick a template (bug report or feature idea) rather than a blank issue, and send security reports to the
# private channel below.
blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/preston-peterson/solar-kiosk/security/advisories/new
    about: |
      For security-shaped bugs (a way around the settings password, logins leaking, anything that breaks
      the trusted-home-network model), please use GitHub's private vulnerability reporting instead of a
      public issue. See SECURITY.md.

  - name: Read the project's stance first
    url: https://github.com/preston-peterson/solar-kiosk/blob/main/CONTRIBUTING.md
    about: |
      solar-kiosk is a one-person hobby project. CONTRIBUTING.md sets expectations for bug reports,
      feature requests, and why pull requests aren't accepted. Worth a skim before filing.
